spring.application.name=alquilaya

# ---- Conexion a MySQL ----
# Los valores se leen de variables de entorno definidas en el archivo .env
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alquilaya}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Servidor ----
server.port=${SERVER_PORT:8082}
server.error.include-message=always

# ---- Jackson ----
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- Usuarios iniciales ----
# Los crea InicializadorDatos al arrancar si no existen
app.admin.email=${ADMIN_EMAIL:admin@alquilaya.com}
app.admin.password=${ADMIN_PASSWORD}
app.operador.email=${OPERADOR_EMAIL:operador@alquilaya.com}
app.operador.password=${OPERADOR_PASSWORD}
